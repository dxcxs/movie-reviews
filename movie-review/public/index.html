<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><title>Marquee - Movie reviews</title></head>
<body class="overlay">
<header class="site-header"><div class="wrap"><a class="logo" href="/">Marquee</a><nav class="nav" id="nav" aria-label="Main"></nav></div></header>
<main>
  <section class="hero" id="hero" aria-label="Featured movie"></section>
  <div class="filters">
    <input id="q" type="search" placeholder="Search titles" aria-label="Search by title" autocomplete="off">
    <select id="sort" aria-label="Sort by">
      <option value="rating">Highest rated</option>
      <option value="date">Newest release</option>
      <option value="title">Title A-Z</option>
    </select>
    <div class="chips" id="chips" role="group" aria-label="Filter by genre"></div>
  </div>
  <div id="results" hidden>
    <p class="count wrap" id="count" aria-live="polite"></p>
    <section class="grid" id="grid"></section>
  </div>
  <div id="rows"></div>
</main>
<footer class="site-footer">Movie data and posters: TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body></html>
